name: Python CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  verify:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt
      - name: Syntax check
        run: python -m compileall -q app config.py run.py make_password.py tests
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Import smoke test
        shell: pwsh
        env:
          DZ_INITIAL_ADMIN_PASSWORD: ci-bootstrap-password
        run: python -c "from app import create_app; app=create_app(); print(app.url_map)"
